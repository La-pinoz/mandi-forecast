name: Daily

# 01:47 UTC = 07:17 IST. In every saved M01 response the dataset was refreshed once a day at about
# 05:05-05:12 IST (its updated_date field), so this leaves about 2 hours of margin. An odd minute,
# because GitHub delays scheduled runs most at the top of the hour. See docs/M05-daily-ingest.md.
on:
  schedule:
    - cron: "47 1 * * *"
  workflow_dispatch:

# One writer at a time: daily and backfill runs share this group, so two runs never compare against the
# same "latest vintage" at once. A queued run waits instead of cancelling the running one.
concurrency:
  group: database-writes
  cancel-in-progress: false

jobs:
  ingest-forecast-score:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      # Temporary diagnostic (2026-11-24): where does the runner connect from? data.gov.in does not answer
      # GitHub's runners (docs/incidents.md). Remove once the question is settled.
      - name: Check runner location
        continue-on-error: true
        run: curl -sS --max-time 20 https://ipinfo.io

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Ingest yesterday and today
        id: ingest
        run: uv run python -m mandi.ingest.ogd ingest

      # Runs even if the ingest step failed (the two cover different dates); the workflow still ends red.
      - name: Recheck the 7 dates before those
        if: ${{ !cancelled() }}
        run: uv run python -m mandi.ingest.ogd recheck

      # Only after a successful ingest: a forecast made from stale data would block today's real one, because
      # each series, origin day, horizon and model can be forecast once. If ingest failed, re-run the workflow
      # once the source works again; the origin day stays the same until midnight IST.
      # Baselines first (committed on their own), then the champion LightGBM from model_registry.
      - name: Forecast (naive, seasonal naive and LightGBM, horizons 1-7)
        if: ${{ !cancelled() && steps.ingest.outcome == 'success' }}
        run: uv run python -m mandi.models.daily_forecast

      # Provisional scores for targets with a reported price; settled scores for targets more than 7 days old
      # (after this morning's recheck looked at them for the last time). Independent of today's ingest.
      - name: Provisional and settled scores
        if: ${{ !cancelled() }}
        run: uv run python -m mandi.evaluate.scoring --settling-days 7
